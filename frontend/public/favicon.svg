<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#382620"/>
      <stop offset="50%" stop-color="#271a16"/>
      <stop offset="100%" stop-color="#160e0c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae2a6"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#a8822e"/>
      <stop offset="100%" stop-color="#e8cb7a"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3d1"/>
      <stop offset="100%" stop-color="#c99f43"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Luxury Badge Base -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3.5"/>
  <rect x="9" y="9" width="110" height="110" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Architectural Tower Icons -->
  <g filter="url(#dropShadow)">
    <!-- Left Wing Tower -->
    <path d="M30 52 L46 40 L46 80 L30 80 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Right Wing Tower -->
    <path d="M82 40 L98 52 L98 80 L82 80 Z" fill="url(#goldGrad)" opacity="0.8"/>
    
    <!-- Central Tower -->
    <path d="M46 32 L64 17 L82 32 L82 80 L46 80 Z" fill="url(#goldLight)"/>
    
    <!-- Tower Spire -->
    <line x1="64" y1="10" x2="64" y2="17" stroke="url(#goldLight)" stroke-width="3" stroke-linecap="round"/>

    <!-- Architectural Window Details -->
    <line x1="53" y1="36" x2="75" y2="36" stroke="#241814" stroke-width="2" stroke-linecap="round"/>
    <line x1="53" y1="44" x2="75" y2="44" stroke="#241814" stroke-width="2" stroke-linecap="round"/>
    <line x1="53" y1="52" x2="75" y2="52" stroke="#241814" stroke-width="2" stroke-linecap="round"/>
    <line x1="53" y1="60" x2="75" y2="60" stroke="#241814" stroke-width="2" stroke-linecap="round"/>
    <line x1="53" y1="68" x2="75" y2="68" stroke="#241814" stroke-width="2" stroke-linecap="round"/>

    <!-- Base / Plinth -->
    <rect x="24" y="80" width="80" height="5" rx="1.5" fill="url(#goldGrad)"/>

    <!-- DNSB Brand Ribbon -->
    <rect x="18" y="89" width="92" height="24" rx="6" fill="#1b110e" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="64" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="900" letter-spacing="3" fill="url(#goldLight)">DNSB</text>
  </g>
</svg>